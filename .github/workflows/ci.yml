name: CI

permissions:
  contents: read

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, llvm-tools-preview, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: taiki-e/install-action@nextest
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Build debug binary
        run: cargo build --locked --package ppoker
      - name: Run Rust tests with coverage
        run: cargo llvm-cov --locked --all-features --workspace --lcov --output-path lcov.info nextest --profile ci
      - name: Upload Rust test results to Codecov
        if: ${{ !cancelled() && hashFiles('target/nextest/ci/junit.xml') != '' }}
        uses: codecov/codecov-action@v7
        with:
          disable_search: true
          files: target/nextest/ci/junit.xml
          name: rust
          report_type: test_results
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload Rust coverage to Codecov
        if: ${{ !cancelled() && hashFiles('lcov.info') != '' }}
        uses: codecov/codecov-action@v7
        with:
          disable_search: true
          files: lcov.info
          flags: rust
          name: rust
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload debug binary
        if: ${{ !cancelled() && hashFiles('target/debug/ppoker') != '' }}
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: linux-x86_64-debug-${{ github.sha }}
          path: target/debug/ppoker
          retention-days: 7

  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CHROME_BIN: google-chrome
      PPOKER_E2E_REUSE_CLIENT_BUILD: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@wasm-pack
      - name: Install frontend dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Run web and WASM checks with coverage
        working-directory: web
        run: pnpm run check:coverage
      - name: Upload web coverage to Codecov
        if: ${{ !cancelled() && hashFiles('web/packages/client/coverage/lcov.info') != '' }}
        uses: codecov/codecov-action@v7
        with:
          disable_search: true
          files: web/packages/client/coverage/lcov.info
          flags: frontend
          name: frontend
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Build site
        working-directory: web
        run: pnpm --filter @ppoker/site run build
      - name: Install Playwright browsers
        working-directory: web
        run: pnpm --filter @ppoker/site exec playwright install --with-deps chromium webkit
      - name: Run browser end-to-end tests
        working-directory: web
        run: pnpm run test:e2e
      - name: Upload Playwright failure artifacts
        if: ${{ !cancelled() && failure() && hashFiles('web/apps/site/test-results/**') != '' }}
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: ignore
          name: playwright-failure-artifacts
          path: |
            web/apps/site/test-results
            web/apps/site/playwright-report
          retention-days: 7
